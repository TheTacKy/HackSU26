name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      ECR_REGISTRY: 160358211926.dkr.ecr.us-west-2.amazonaws.com
      ECR_REPOSITORY: repo-scout
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ "$ROLE_ARN" != 'arn:aws:iam::160358211926:role/repo-scout-github-deploy' ]; then
            echo '::error::AWS_ROLE_ARN must exactly match the repo-scout-github-deploy role ARN (without spaces or newlines).'
            exit 1
          fi
      - name: Diagnose GitHub OIDC identity
        run: node .github/scripts/oidc-diagnostic.mjs
      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '160358211926'
          retry-max-attempts: 2
      - name: Log in to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Build and publish Lambda image
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "### Published Lambda image" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged URI: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest URI: $ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
